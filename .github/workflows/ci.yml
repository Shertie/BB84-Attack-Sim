name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: testy @slow
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,crosscheck,verify]'
      - run: make lint typecheck coverage PY=python

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,crosscheck,verify]'
      - run: make test-slow PY=python

  # S2 (ROADMAP): czysty klon odtwarza wszystkie wykresy; każdy eksperyment kończy się błędem,
  # gdy jego wynik wyjdzie poza tolerancję. Lokalnie (12 rdzeni) ok. 5 min.
  figures:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,crosscheck,verify]'
      - name: make figures (z pomiarem czasu)
        run: |
          start=$(date +%s)
          make figures PY=python
          echo "make figures: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
